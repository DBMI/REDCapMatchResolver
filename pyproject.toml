[project]
name = "redcapmatchresolver"
version = "1.6.0"
description = "Assists with human expert review of possible patient matches."
license = {file = 'LICENSE'}
readme = "README.md"
authors = [
    {name = "Kevin J. Delaney", email = "<kjdelaney@health.ucsd.edu>"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
documentation = "https://github.com/DBMI/REDCapMatchResolver"
homepage = "https://github.com/DBMI/REDCapMatchResolver"
repository = "https://github.com/DBMI/REDCapMatchResolver"

[tool.poetry]
package-mode = false
packages = [
    { include = "redcapmatchresolver", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.12, <4.0"
pandas = ">=2.2.0"
tabulate = "^0.9.0"
redcaputilities = {git = "https://github.com/DBMI/REDCapUtilities.git", rev="main"}
pyyaml = "^6.0.1"

[tool.poetry.group.dev.dependencies]
autoflake = "*"
black = "*"
data-science-types = "*"
flake8 = "*"
flake8-bugbear = "*"
flake8-builtins = "*"
flake8-comprehensions = "*"
flake8-debugger = "*"
flake8-eradicate = "*"
flake8-logging = "*"
isort = "*"
make = "*"
mkdocs = "*"
mkdocstrings = "*"
mkdocs-material = "*"
mypy = "^2.3.0"
openpyxl = "*"
pandas = "*"
pandas-stubs = "*"
pep8-naming = "*"
pre-commit = "*"
pymdown-extensions = "*"
pytest = "^7.2.0"
pytest-github-actions-annotate-failures = "*"
pytest-cov = "*"
pyupgrade = "*"
setuptools = "*"
typing-extensions = "^4.16.0"
tryceratops = "*"
typing = "*"
wheel = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]

[tool.black]
target-version = ["py311"]
include = '\.pyi?$'

[tool.pytest.ini_options]
addopts = """\
    --cov-report term-missing \
    --no-cov-on-fail \
"""
pythonpath = [
  ".", "src", "src/redcapmatchresolver"
]
testpaths= ["redcapmatchresolver"]

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    'if TYPE_CHECKING:',
    'pragma: no cover'
]

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
check_untyped_defs = true
show_error_codes = true
ignore_missing_imports = true
disable_error_code = ["call-arg", "call-overload", "var-annotated"]
