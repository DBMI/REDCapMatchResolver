name: 'Setup Python + Poetry environment action'
description: 'Setup Python + Poetry environment'

inputs:
  python-version:
    required: false
    description: 'Python version'
    default: '3.11'
outputs: {}
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{inputs.python-version}}
    - name: Install setuptools
      run: pip install setuptools
      shell: bash
    - name: Install poetry
      run: python -m pip install poetry "poetry==2.4.1"
      shell: bash
    - name: Create virtual environment
      run: poetry install
      shell: bash
