pre-commit.ci:
  autofix_commit_msg: '[pre-commit.ci] auto fixes from pre-commit hooks'
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  # Force a stable Python version matching your project requirements
  python: python3.11
  # This installs poetry and all your dev dependencies in the CI runner
  pre_install:
    - pip install poetry
    - poetry install
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
        files: "py$"
      - id: trailing-whitespace
        files: "py$"
      - id: mixed-line-ending
# Advised by Gemini to use GitHub's own mypy version.
- repo: https://github.com
  rev: v1.11.1  # A modern version built for Python 3.12+
  hooks:
    - id: mypy
      files: ^src/redcapmatchresolver/
      # If your code relies on numpy or other stubs, tell pre-commit here:
      additional_dependencies: [numpy]
# Full section written by Gemini.
- repo: local
  hooks:
    - id: autoflake
      name: autoflake
      entry: poetry run autoflake -r --remove-all-unused-imports --remove-unused-variables src/redcapmatchresolver
      files: "py$"
      language: system
      types: [ python ]
    - id: isort
      name: isort
      entry: poetry run isort src/redcapmatchresolver
      files: "py$"
      language: system
      types: [ python ]
    - id: black
      name: black
      entry: poetry run black src/redcapmatchresolver
      files: "py$"
      language: system
      types: [ python ]
    - id: pyupgrade
      name: pyupgrade
      entry: poetry run pyupgrade --py37-plus
      language: system
      types: [ python ]
    - id: flake8
      name: flake8
      entry: poetry run flake8 src/redcapmatchresolver
      args: [ "--config=.flake8" ]
      exclude: "tests"
      files: "py$"
      language: system  # Changed from python
      types: [ python ]