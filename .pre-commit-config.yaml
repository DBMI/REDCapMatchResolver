# 1. Root configuration for the pre-commit.ci runner
pre-commit.ci:
  autofix_commit_msg: '[pre-commit.ci] auto fixes from pre-commit hooks'
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  python: python3.12  # Matches your runner's target Python version
  pre_install:
    - pip install poetry
    - poetry install

# 2. Main repositories section
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
        files: "py$"
      - id: trailing-whitespace
        files: "py$"
      - id: mixed-line-ending

# 3. Clean native mypy implementation (No more poetry run internal crashes!)
-   repo: https://github.com
    rev: v1.11.1
    hooks:
      - id: mypy
        files: "py$"
        additional_dependencies: [numpy, types-requests] # Add any stub libraries here

# 4. Local hooks managed via poetry env
-   repo: local
    hooks:
      - id: autoflake
        name: autoflake
        entry: poetry run autoflake -r --remove-all-unused-imports --remove-unused-variables src/redcapmatchresolver
        files: "py$"
        language: system
        types: [ python ]
      - id: isort
        name: isort
        entry: poetry run isort src/redcapmatchresolver
        files: "py$"
        language: system
        types: [ python ]
      - id: black
        name: black
        entry: poetry run black src/redcapmatchresolver
        files: "py$"
        language: system
        types: [ python ]
      - id: pyupgrade
        name: pyupgrade
        entry: poetry run pyupgrade --py37-plus
        language: system
        types: [ python ]
      - id: flake8
        name: flake8
        entry: poetry run flake8 src/redcapmatchresolver
        args: [ "--config=.flake8" ]
        exclude: "tests"
        files: "py$"
        language: system
        types: [ python ]
