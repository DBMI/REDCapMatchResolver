repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
        files: "py$"
      - id: trailing-whitespace
        files: "py$"
      - id: mixed-line-ending

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.19.1
    hooks:
      - id: pyupgrade
        args: [--py311-plus]

  - repo: local
    hooks:
      - id: autoflake
        name: autoflake
        entry: poetry run autoflake -r --remove-all-unused-imports --remove-unused-variables src/redcapmatchresolver
        files: "py$"
        language: system
        types: [ python ]

      - id: isort
        name: isort
        entry: poetry run isort src/redcapmatchresolver
        files: "py$"
        language: system
        types: [ python ]

      - id: black
        name: black
        entry: poetry run black src/redcapmatchresolver
        files: "py$"
        language: system
        types: [ python ]

      - id: mypy
        name: mypy
        entry: poetry run mypy src/redcapmatchresolver
        require_serial: true
        files: "py$"
        language: python
        types: [python]
        pass_filenames: false
        additional_dependencies: ["mypy==2.3.0"]

      - id: flake8
        name: flake8
        additional_dependencies:
          - tryceratops
        entry: poetry run flake8 src/redcapmatchresolver
        args: [ "--config=.flake8" ]
        exclude: "tests"
        files: "py$"
        language: python
        types: [ python ]
